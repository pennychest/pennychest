name: Docs

# Builds the docs on every pull request, so a broken link or page fails CI. On main, asks
# pennychest/pennychest.github.io, which builds and publishes the site, to rebuild, as the
# release GitHub App. The token is limited to that repository.
on:
  pull_request:
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  rebuild:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pennychest.github.io
          permission-contents: write   # repository_dispatch needs it

      - run: gh api repos/pennychest/pennychest.github.io/dispatches -f event_type=docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
