name: Docs

# The docs are built and published by pennychest/pennychest.github.io; ask it to rebuild,
# as the release GitHub App. The token is limited to that repository.
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml]

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pennychest.github.io
          permission-contents: write   # repository_dispatch needs it

      - run: gh api repos/pennychest/pennychest.github.io/dispatches -f event_type=docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
