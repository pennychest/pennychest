name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # Each plugin's tests against this version of core, so a change to the plugin interface
  # can't break them unnoticed.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pennychest/pennychest-plugins
          path: pennychest-plugins
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            pennychest-plugins/*/pyproject.toml
      - run: pip install -e backend
      - name: Test each plugin
        run: |
          for project in pennychest-plugins/*/pyproject.toml; do
            plugin=$(dirname "$project")
            echo "::group::$plugin"
            pip install -e "$plugin[dev]"
            python -m pytest -q "$plugin/tests"
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
