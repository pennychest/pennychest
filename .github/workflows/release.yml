name: Release

# Merging is the release. Commitizen reads the gitmoji on the new commits, and
# if any of them warrant a version (see bump_map in .cz.toml) it bumps the
# version, writes the changelog and tags. Everything else is a no-op.
#
# It pushes as the release GitHub App rather than with GITHUB_TOKEN, because
# only an app can be let past the ruleset on main. Pushes made with an app's
# token also start workflows, so the tag push starts Publish, which builds the
# release's image.
on:
  push:
    branches: [main]

concurrency:
  # Not cancel-in-progress: a half-finished release leaves a bump commit with
  # no tag.
  group: release

jobs:
  release:
    name: Bump, tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # everything that writes uses the app's token

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # commitizen reads history back to the last tag
          token: ${{ steps.app-token.outputs.token }}   # so the push is the app's

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Bump the version if the commits warrant one
        id: bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Commit as the app's bot user, so the commit is linked to it.
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          before=$(uvx --from 'commitizen>=4,<5' cz version --project)
          # Exits non-zero when nothing is releasable, so compare versions
          # instead of trusting the exit code.
          uvx --from 'commitizen>=4,<5' cz bump --yes \
            --changelog-to-stdout --git-output-to-stderr > notes.md || true
          after=$(uvx --from 'commitizen>=4,<5' cz version --project)

          if [ "$before" = "$after" ]; then
            echo "No releasable commits since v$before." >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --follow-tags origin HEAD:main

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$after" >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: v${{ steps.bump.outputs.version }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md
