# One-click deploy to Render: the "Deploy to Render" button reads this file.
services:
  - type: web
    name: pennychest
    runtime: image
    image:
      url: ghcr.io/pennychest/pennychest:latest
    # Disks need a paid plan; starter is the smallest.
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    # The database lives here. A disk also keeps the service to one instance, which SQLite
    # needs.
    disk:
      name: pennychest-data
      mountPath: /data
      sizeGB: 1
