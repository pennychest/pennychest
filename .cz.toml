[tool.commitizen]
name = "cz_customize"
# The version lives in the workspace Cargo.toml, which every crate inherits, and is reported by
# /api/health, the MCP server and the OpenAPI description (whose info.version is the only line
# indented four spaces).
version = "0.5.1"
version_files = ["Cargo.toml:^version", 'openapi.json:^    "version"']
tag_format = "v$version"
update_changelog_on_bump = true
annotated_tag = true
# 🔖 is not in bump_pattern, so the release commit never cuts a release itself.
bump_message = "🔖 Release v$new_version"
# Pre-1.0: a breaking change bumps the minor, rather than jumping to 1.0.0.
major_version_zero = true
# Cargo.lock records the workspace crates' versions too: bring it into line, so builds with
# --locked keep working, and include it in the release commit.
pre_bump_hooks = ["cargo update --workspace --offline", "git add Cargo.lock"]

[tool.commitizen.customize]
# Which gitmoji cut a release, and how far the version moves. A commit whose
# gitmoji is not listed here does not release at all — that is how docs, CI,
# tests and formatting merge without producing a version nobody asked for.
bump_pattern = "^(💥|✨|🔌|🔐|🤖|💬|📊|📈|📱|🧠|🧭|📦|🐛|🚑|🩹|🔒|⚡️|♻️|🗃️|🐳|🔧|⬆️|💄|🍱|🚸|♿️|🌐|🔊|⏪|🗑️|🔥)"

# What appears in the changelog. Wider than the bump list, so documentation
# shows up in release notes without producing a release of its own — and
# narrow enough that merge commits and chores stay out.
changelog_pattern = "^(💥|✨|🔌|🔐|🤖|💬|📊|📈|📱|🧠|🧭|📦|🐛|🚑|🩹|🔒|⚡️|♻️|🗃️|🐳|🔧|⬆️|💄|🍱|🚸|♿️|🌐|🔊|⏪|🗑️|🔥|📝)"

# Reads the gitmoji as the change type so entries can be grouped, without
# consuming it — the lookahead leaves it in the message, so it still shows in
# the entry as well as choosing the section.
commit_parser = "^(?=(?P<change_type>💥|✨|🔌|🔐|🤖|💬|📊|📈|📱|🧠|🧭|📦|🐛|🚑|🩹|🔒|⚡️|♻️|🗃️|🐳|🔧|⬆️|💄|🍱|🚸|♿️|🌐|🔊|⏪|🗑️|🔥|📝))(?P<message>.*)"
change_type_order = ["Breaking", "Added", "Fixed", "Changed", "Documentation"]

[tool.commitizen.customize.bump_map]
"💥" = "MAJOR"   # breaking change
"✨" = "MINOR"   # new feature
"🔌" = "MINOR"   # plugins and integrations
"🔐" = "MINOR"   # authentication
"🤖" = "MINOR"   # AI features
"💬" = "MINOR"   # chat
"📊" = "MINOR"   # dashboards and charts
"📈" = "MINOR"   # reports
"📱" = "MINOR"   # mobile features
"🧠" = "MINOR"   # learning and suggestions
"🧭" = "MINOR"   # new pages and navigation
"📦" = "MINOR"   # import, export and backup
"🐛" = "PATCH"   # bug fix
"🚑" = "PATCH"   # hotfix
"🩹" = "PATCH"   # simple fix
"🔒" = "PATCH"   # security fix
"⚡️" = "PATCH"  # performance
"♻️" = "PATCH"  # refactor
"🗃️" = "PATCH"  # database migrations
"🐳" = "PATCH"   # docker
"🔧" = "PATCH"   # configuration
"⬆️" = "PATCH"  # dependency bump
"💄" = "PATCH"   # ui
"🍱" = "PATCH"   # assets
"🚸" = "PATCH"   # user experience
"♿️" = "PATCH"  # accessibility
"🌐" = "PATCH"   # localisation
"🔊" = "PATCH"   # logging
"⏪" = "PATCH"   # undo and revert
"🗑️" = "PATCH"  # deprecation
"🔥" = "PATCH"   # removal

# Which section of the changelog each gitmoji lands in.
[tool.commitizen.customize.change_type_map]
"💥" = "Breaking"
"✨" = "Added"
"🔌" = "Added"
"🔐" = "Added"
"🤖" = "Added"
