# PennyChest on this machine: docker compose up, then open http://localhost:8000.
services:
  pennychest:
    build: .
    # Or use the published image instead of building it:
    # image: ghcr.io/pennychest/pennychest:latest
    ports:
      - "8000:8000"
    volumes:
      # The database, uploaded statements and plugins.
      - pennychest-data:/data
    restart: unless-stopped

volumes:
  pennychest-data:
