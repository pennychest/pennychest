[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/plugin", "tools/evaluate"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pennychest/pennychest"
rust-version = "1.97"

[workspace.dependencies]
pennychest-core = { path = "crates/core" }
pennychest-plugin = { path = "crates/plugin" }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
flate2 = "1"
csv = "1"
futures-util = { version = "0.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
hex = "0.4"
mime_guess = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
rust_decimal = "1"
schemars = { version = "1", features = ["chrono04"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
subtle = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p1"] }
utoipa = "5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies without debug information: with wasmtime in every test binary, the tests
# otherwise take twice the disk (14 GB rather than 7), more than a CI runner can spare.
[profile.dev.package."*"]
debug = false

# Password hashing is deliberately slow; unoptimised, it makes the tests crawl.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
